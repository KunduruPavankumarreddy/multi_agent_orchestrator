[project]
name = "multi-agent-orchestrator"
version = "0.1.0"
description = "Multi-agent system for asynchronous task orchestration"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false